# Checks every push and pull request: backend tests and lint, frontend
# typecheck/lint/build, and the production Docker images.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # A real PostgreSQL, like local development: tests run the real migrations.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careerlens
          POSTGRES_PASSWORD: careerlens
          POSTGRES_DB: careerlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerlens -d careerlens_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://careerlens:careerlens@localhost:5432/careerlens_test
      TEST_DATABASE_URL: postgresql+psycopg://careerlens:careerlens@localhost:5432/careerlens_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The build generates next-env.d.ts (git-ignored), which the typecheck needs.
      - run: npm run build
      - run: npm run typecheck

  docker:
    name: Production images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag careerlens-backend ./backend
      - run: docker build --tag careerlens-frontend --build-arg API_URL=http://backend:8000 ./frontend

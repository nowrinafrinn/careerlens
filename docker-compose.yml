# Local development services: only PostgreSQL runs in Docker. The backend and
# frontend run on the host so they reload instantly while you edit.
# For deployment use docker-compose.prod.yml (see docs/DEPLOY.md).

# Fixed project name, so the data volume is "careerlens_careerlens-pgdata"
# no matter which folder the repo is cloned into.
name: careerlens

services:
  db:
    image: postgres:16-alpine
    container_name: careerlens-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerlens}
      POSTGRES_DB: ${POSTGRES_DB:-careerlens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives `docker compose down` and container restarts.
      # Only `docker compose down -v` deletes it.
      - careerlens-pgdata:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume: creates the test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerlens} -d ${POSTGRES_DB:-careerlens}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  careerlens-pgdata:
